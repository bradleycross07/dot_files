# keep dentry/inode cache longer
vm.vfs_cache_pressure=50

# zram: swapping to compressed RAM is cheap
vm.swappiness=180
vm.page-cluster=0

# reclaim memory earlier and more smoothly, instead of in bursts
vm.watermark_boost_factor=0
vm.watermark_scale_factor=125

# flush writes in smaller batches (fewer stalls during big copies and installs)
vm.dirty_background_bytes=67108864
vm.dirty_bytes=268435456
