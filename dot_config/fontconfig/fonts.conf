<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
<match target="font">
  <test name="family">
    <string>DepartureMono Nerd Font Mono</string>
  </test>
    <edit name="hintstyle" mode="assign">
    <const>hintmedium</const>
  </edit>
  <edit name="autohint" mode="assign">
    <bool>false</bool>
  </edit>
  <edit name="antialias" mode="assign">
    <bool>true</bool>
  </edit>
</match>
</fontconfig>
