<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>

  <!-- Global defaults for every font: greyscale antialiasing, slight hinting.
       Matches xsettingsd so X and Wayland apps render the same. -->
  <match target="font">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
    <edit name="rgba" mode="assign"><const>none</const></edit>
  </match>

  <!-- Departure Mono (pixel font): antialiased, unhinted, greyscale.
       Comes after the global block so it wins for this font. -->
  <match target="font">
    <test name="family">
      <string>DepartureMono Nerd Font Mono</string>
    </test>
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>false</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintnone</const></edit>
    <edit name="autohint" mode="assign"><bool>false</bool></edit>
    <edit name="rgba" mode="assign"><const>none</const></edit>
  </match>

  <!-- UI and monospace text: Departure Mono first, Noto as a fallback
       for characters it doesn't have (CJK, symbols, accents). -->
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>DepartureMono Nerd Font Mono</family>
      <family>Noto Sans</family>
    </prefer>
  </alias>
  <alias>
    <family>monospace</family>
    <prefer>
      <family>DepartureMono Nerd Font Mono</family>
      <family>Noto Sans Mono</family>
    </prefer>
  </alias>

  <!-- Serif stays Noto Serif for reading. -->
  <alias>
    <family>serif</family>
    <prefer><family>Noto Serif</family></prefer>
  </alias>

</fontconfig>
