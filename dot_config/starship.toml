"$schema" = 'https://starship.rs/config-schema.json'

format = """
[](#6F4E37)\
$os\
$username\
[](bg:#D9A62E fg:#6F4E37)\
$directory\
[](fg:#D9A62E bg:#EAD9B8)\
$git_branch\
$git_status\
[](fg:#EAD9B8 bg:#FFF8E7)\
$c\
$elixir\
$elm\
$golang\
$gradle\
$haskell\
$java\
$julia\
$maven\
$nodejs\
$bun\
$nim\
$rust\
$scala\
[](fg:#FFF8E7 bg:#3B2A1A)\
$docker_context\
[](fg:#3B2A1A bg:#6F4E37)\
$time\
[ ](fg:#EAD9B8)\
"""

# Disable the blank line at the start of the prompt
# add_newline = false

# You can also replace your username with a neat symbol like   or disable this
# and use the os module below
[username]
show_always = true
style_user = "bg:#6F4E37 fg:#EAD9B8"
style_root = "bg:#6F4E37 fg:#EAD9B8"
format = '[$user ]($style)'
disabled = false

# An alternative to the username module which displays a symbol that
# represents the current operating system
[os]
style = "bg:#6F4E37"
disabled = true # Disabled by default

[directory]
style = "bg:#D9A62E fg:#6F4E37"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

# Here is how you can shorten some long paths by text replacement
# similar to mapped_locations in Oh My Posh:
[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "
# Keep in mind that the order matters. For example:
# "Important Documents" = " 󰈙 "
# will not be replaced, because "Documents" was already substituted before.
# So either put "Important Documents" before "Documents" or use the substituted version:
# "Important 󰈙 " = " 󰈙 "

[c]
symbol = " "
style = "bg:#FFF8E7"
format = '[ $symbol ($version) ]($style)'

[cpp]
symbol = " "
style = "bg:#FFF8E7"
format = '[ $symbol ($version) ]($style)'

[docker_context]
symbol = " "
style = "bg:#3B2A1A"
format = '[ $symbol $context ]($style)'

[elixir]
symbol = " "
style = "bg:#FFF8E7"
format = '[ $symbol ($version) ]($style)'

[elm]
symbol = " "
style = "bg:#FFF8E7"
format = '[ $symbol ($version) ]($style)'

[git_branch]
symbol = ""
style = "bg:#EAD9B8"
format = '[ $symbol $branch ]($style)'

[git_status]
style = "bg:#EAD9B8"
format = '[$all_status$ahead_behind ]($style)'

[golang]
symbol = " "
style = "bg:#FFF8E7"
format = '[ $symbol ($version) ]($style)'

[gradle]
style = "bg:#FFF8E7"
format = '[ $symbol ($version) ]($style)'

[haskell]
symbol = " "
style = "bg:#FFF8E7"
format = '[ $symbol ($version) ]($style)'

[java]
symbol = " "
style = "bg:#FFF8E7"
format = '[ $symbol ($version) ]($style)'

[julia]
symbol = " "
style = "bg:#FFF8E7"
format = '[ $symbol ($version) ]($style)'

[maven]
style = "bg:#FFF8E7"
format = '[ $symbol ($version) ]($style)'

[nodejs]
symbol = ""
style = "bg:#FFF8E7"
format = '[ $symbol ($version) ]($style)'

[bun]
symbol = ""
style = "bg:#FFF8E7"
format = '[ $symbol ($version) ]($style)'

[nim]
symbol = "󰆥 "
style = "bg:#FFF8E7"
format = '[ $symbol ($version) ]($style)'

[rust]
symbol = ""
style = "bg:#FFF8E7"
format = '[ $symbol ($version) ]($style)'

[scala]
symbol = " "
style = "bg:#FFF8E7"
format = '[ $symbol ($version) ]($style)'

[time]
disabled = false
time_format = "%R" # Hour:Minute Format
style = "bg:#6F4E37 fg:#EAD9B8"
format = '[ ♥ $time ]($style)'
