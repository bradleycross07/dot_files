# Fonts
font_family      DepartureMono Nerd Font Mono
bold_font        DepartureMono Nerd Font Mono
italic_font      DepartureMono Nerd Font Mono
bold_italic_font DepartureMono Nerd Font Mono
font_size 11.0

# disable middle mouse paste
mouse_map middle release ungrabbed no_op

# confirm on close
confirm_os_window_close 1

# shell integration
shell_integration enabled

# multiplexer layout
enabled_layouts tall,fat,grid,stack,splits
window_padding_width 6

map ctrl+shift+enter launch --location=split
map ctrl+shift+minus launch --location=hsplit
map ctrl+shift+backslash launch --location=vsplit
map ctrl+shift+] next_window
map ctrl+shift+[ previous_window
map ctrl+shift+f resize_window larger
map ctrl+shift+g resize_window smaller
map ctrl+shift+z toggle_layout stack

# tabs
map ctrl+shift+t new_tab
map ctrl+shift+q close_tab
map ctrl+shift+right next_tab
map ctrl+shift+left previous_tab
tab_bar_style powerline
tab_powerline_style slanted
tab_title_template "{title}"

# scrollback
scrollback_lines 10000
map ctrl+shift+h show_scrollback
scrollback_pager nvim -c "set ft=man" -

# hints kitten
map ctrl+shift+e kitten hints

# remote control
allow_remote_control yes
listen_on unix:/tmp/kitty

# cursor
cursor_shape beam
cursor_blink_interval 0

# colours - pompompurin themed
background #2A1D12
background_opacity 0.92
foreground #FFF8E7

cursor               #F4C542
selection_background #6F4E37
selection_foreground #FFF8E7

