# hardware decoding - AMD 5500U iGPU
hwdec=vaapi
hwdec-codecs=h264,hevc,vp9,mpeg2video,vc1

# youtube via yt-dlp: VP9 up to 1440p (hardware-decodable)
ytdl-format=bestvideo[vcodec~='^vp0?9'][height<=1440][dynamic_range=SDR]+bestaudio/bestvideo[vcodec~='^vp0?9'][height<=1440]+bestaudio/best
save-position-on-quit=yes

# native wayland output
vo=gpu-next
gpu-api=opengl
gpu-context=wayland

ao=pipewire

# reduce banding/blocking in dark gradients
deband=yes

# scaling
scale=ewa_lanczossharp
cscale=ewa_lanczossharp
dscale=mitchell

# HDR tone mapping
tone-mapping=auto
hdr-compute-peak=no
target-colorspace-hint=auto

# cache for smoother local file playback
cache=yes
cache-pause=no
demuxer-max-bytes=400MiB
demuxer-max-back-bytes=100MiB
demuxer-readahead-secs=30

# subtitles
sub-auto=fuzzy
sub-font-size=34
sub-border-size=2.5

# screenshot format
screenshot-format=png
screenshot-high-bit-depth=yes
screenshot-directory=~/Pictures/Screenshots
screenshot-template="%F-%wH.%wM.%wS"

# misc
msg-level=ffmpeg=no

[yt4k]
ytdl-format=bestvideo[vcodec~='^vp0?9'][height<=2160][dynamic_range=SDR]+bestaudio/best
cscale=lanczos
dscale=hermite
deband=yes
