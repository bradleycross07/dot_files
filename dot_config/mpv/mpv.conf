# hardware decoding - AMD
hwdec=vaapi
hwdec-codecs=all

# native wayland output
vo=gpu-next
gpu-api=vulkan
gpu-context=waylandvk
ao=pipewire

# scaling
correct-downscaling=no
scale=mitchell
dscale=micthell
cscale=mitchell

# HDR tone mapping
tone-mapping=hable
hdr-compute-peak=yes

# syncing
# video-sync=display-resample
# interpolation=no

# cache for smoother local file playback
cache=yes
demuxer-max-bytes=400MiB
demuxer-max-back-bytes=100MiB
demuxer-readahead-secs=30
cache-pause=no

# subtitles
sub-auto=fuzzy
sub-font-size=38

# screenshot format
screenshot-format=png
screenshot-directory=~/Pictures/Screenshots
